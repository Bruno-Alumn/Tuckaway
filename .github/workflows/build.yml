name: Build

on:
  push:
    branches:
      - "agent/**"
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Tuckaway
        run: >-
          xcodebuild
          -project "Tuckaway.xcodeproj"
          -scheme "Tuckaway"
          -configuration Release
          -destination "platform=macOS"
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package app
        run: |
          xattr -cr "build/DerivedData/Build/Products/Release/Tuckaway.app"
          codesign --force --deep --sign - "build/DerivedData/Build/Products/Release/Tuckaway.app"
          codesign --verify --deep --strict "build/DerivedData/Build/Products/Release/Tuckaway.app"
          ditto -c -k --keepParent \
            "build/DerivedData/Build/Products/Release/Tuckaway.app" \
            Tuckaway.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tuckaway
          path: Tuckaway.zip
          if-no-files-found: error
