name: Build

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes its earlier run pointless. Pushes each get
# their own group (by commit): GitHub keeps only one pending run per group and
# drops the rest even without cancel-in-progress, which skipped merges on main.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test direct build
        run: >-
          xcodebuild
          -project "Tuckaway.xcodeproj"
          -scheme "Tuckaway"
          -configuration Debug-Direct
          -destination "platform=macOS"
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Analyze direct build
        run: >-
          xcodebuild
          -project "Tuckaway.xcodeproj"
          -scheme "Tuckaway"
          -configuration Debug-Direct
          -destination "platform=macOS"
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          analyze

      - name: Build App Store variant
        run: >-
          xcodebuild
          -project "Tuckaway.xcodeproj"
          -scheme "Tuckaway"
          -configuration Debug
          -destination "platform=macOS"
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      # The package is only useful from main; pull requests stop at tests and
      # the App Store build, which roughly halves their wait.
      - name: Package direct release
        if: github.event_name == 'push'
        run: |
          xcodebuild \
            -project "Tuckaway.xcodeproj" \
            -scheme "Tuckaway" \
            -configuration Release-Direct \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          xattr -cr "build/DerivedData/Build/Products/Release-Direct/Tuckaway.app"
          codesign --force --deep --sign - "build/DerivedData/Build/Products/Release-Direct/Tuckaway.app"
          codesign --verify --deep --strict "build/DerivedData/Build/Products/Release-Direct/Tuckaway.app"
          ditto -c -k --keepParent \
            "build/DerivedData/Build/Products/Release-Direct/Tuckaway.app" \
            Tuckaway.zip

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: Tuckaway-direct
          path: Tuckaway.zip
          if-no-files-found: error
